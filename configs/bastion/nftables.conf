#!/usr/sbin/nft -f
# /etc/nftables.conf — lab-bastion01 (phase 9 : filtrage + NAT)
flush ruleset

table inet filter {
    # Ce qui ENTRE dans le bastion
    chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept   # les réponses
        ct state invalid drop                 # paquets incohérents
        iif "lo" accept                       # la machine se parle à elle-même
        ip protocol icmp accept               # ping
        iifname "ens32" tcp dport 22 accept   # SSH, seulement côté NAT
    }
    # Ce qui TRAVERSE le bastion (web/db vers internet)
    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        iifname "ens34" oifname "ens32" accept
    }
    # Ce qui SORT du bastion
    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname "ens32" ip saddr 10.10.10.0/24 masquerade
    }
}
