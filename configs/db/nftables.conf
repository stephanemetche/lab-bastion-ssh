#!/usr/sbin/nft -f
# /etc/nftables.conf — lab-db01 : SSH depuis le bastion, MariaDB depuis web uniquement
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        ct state invalid drop
        iif "lo" accept
        ip protocol icmp accept
        ip saddr 10.10.10.1 tcp dport 22 accept
        ip saddr 10.10.10.10 tcp dport 3306 accept
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
    }
    chain output {
        type filter hook output priority filter; policy accept;
    }
}
